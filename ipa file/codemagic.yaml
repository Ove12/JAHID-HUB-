workflows:
  ios-release:
    name: Build JAHID HUB IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build IPA Archive
        script: |
          cd "ipa file"
          xcodebuild clean archive \
            -project JahidHub.xcodeproj \
            -scheme JahidHub \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/JahidHub.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA for Sideloading
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$CM_BUILD_DIR/JahidHub.xcarchive/Products/Applications/JahidHub.app" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -r "JahidHub-v1.0.0.ipa" Payload
          mkdir -p build/ios/ipa
          mv "JahidHub-v1.0.0.ipa" build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa

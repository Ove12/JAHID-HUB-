workflows:
  ios-release:
    name: Build JAHID HUB IPA
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build and Package IPA
        script: |
          set -e
          echo "Building JahidHub for iOS..."
          xcodebuild clean build \
            -project "ipa file/JahidHub.xcodeproj" \
            -scheme JahidHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/derivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          echo "Packaging into IPA..."
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$CM_BUILD_DIR/derivedData/Build/Products/Release-iphoneos/JahidHub.app" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -qr "JahidHub-v1.0.0.ipa" Payload
          mkdir -p build/ios/ipa
          mv "JahidHub-v1.0.0.ipa" build/ios/ipa/
          echo "IPA successfully created at build/ios/ipa/JahidHub-v1.0.0.ipa"
    artifacts:
      - build/ios/ipa/*.ipa

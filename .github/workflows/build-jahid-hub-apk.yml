name: Build JAHID HUB APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Stable Release & Debug APK
      run: ./gradlew assembleStableRelease assembleStableDebug --stacktrace

    - name: Upload All Built APKs
      uses: actions/upload-artifact@v4
      with:
        name: JAHID-HUB-APKs
        path: "app/build/outputs/apk/**/*.apk"
